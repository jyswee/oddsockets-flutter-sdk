name: oddsockets_flutter_demo
description: Two-client cross-delivery round-trip demo and regression for the OddSockets Flutter SDK.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Path dependency on the parent SDK so this demo is clone-and-run.
  oddsockets_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
